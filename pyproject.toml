[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookforge"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "requests>=2.31", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
vectors = ["sentence-transformers>=3.0", "numpy"]
webui = ["streamlit>=1.40"]
tokens = ["tiktoken"]
test = ["pytest>=8"]

[project.scripts]
bookforge = "bookforge.cli:main"

[tool.setuptools.packages.find]
include = ["bookforge*"]

[tool.setuptools.package-data]
bookforge = ["style/*", "style/*/*", "style/*/*/*", "style/*/*/*/*", "jev_templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
